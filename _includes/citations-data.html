<script type="text/javascript">
  // Build a citations map from either page.references (legacy) or page.bibtex (BibTeX entries)
  window.__CITATIONS = {};
  {%- if page.references -%}
    {%- for r in page.references -%}
      {%- assign key = r.key | default: 'r' | append: forloop.index -%}
      window.__CITATIONS["{{ key }}"] = { index: {{ forloop.index }}, ref_id: "ref-{{ forloop.index }}" };
    {%- endfor -%}
  {%- elsif page.bibtex -%}
    {%- assign idx = 0 -%}
    {%- for pair in page.bibtex -%}
      {%- assign key = pair[0] -%}
      {%- assign idx = idx | plus: 1 -%}
      window.__CITATIONS["{{ key }}"] = { index: {{ idx }}, ref_id: "ref-{{ idx }}" };
    {%- endfor -%}
  {%- endif -%}
</script>
